<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Questionnaire — Opus Gubernatio</title>
<!--
  T7/T8 — intake and debrief questionnaires. A separate page, same reasoning as
  workspace.html: never loads sim.js/simulations.js/categories.js/knowledge.js.

  The form is built ENTIRELY from a JSON definition fetched at runtime
  (assets/questionnaires/intake.json or debrief.json), never from markup in this
  file. Editing that JSON and reloading changes the form with no code edit —
  see questionnaires.js's renderForm().
-->
<link rel="stylesheet" href="assets/css/radar.css">
<style>
  body { min-height: 100vh; padding: 0; }
  .q-shell { max-width: 800px; margin: 0 auto; padding: 32px 28px 64px; }
  .q-card { background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--radius-md); padding: 24px 26px; margin-bottom: 16px; }
  .q-note {
    background: var(--surface-soft); border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12px;
    color: var(--muted); margin-bottom: 18px;
  }
  .q-title { font-family: var(--font-display); font-size: 20px; margin: 0 0 4px; }
  .q-subtitle { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
  .q-section { margin-bottom: 22px; }
  .q-section h3 { font-family: var(--font-display); font-size: 15px; margin: 0 0 4px; }
  .q-section-note { font-size: 11px; color: var(--muted); margin: 0 0 10px; }
  .q-item { margin-bottom: 16px; }
  .q-label { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text); }
  .q-required { color: var(--status-red); margin-left: 3px; }
  .q-input, .q-select, .q-textarea {
    width: 100%; padding: 8px 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--page-bg); color: var(--text);
    font-size: 13px; font-family: var(--font-body);
  }
  .q-textarea { min-height: 70px; resize: vertical; }
  .q-options { display: flex; flex-direction: column; gap: 6px; }
  .q-option-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .q-likert { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .q-likert-scale { display: flex; gap: 8px; }
  .q-likert-scale label { display: flex; flex-direction: column; align-items: center;
                          font-size: 11px; color: var(--muted); gap: 3px; }
  .q-likert-endlabel { font-size: 11px; color: var(--faint); max-width: 90px; }
  .q-btn { background: var(--brand-bronze); color: #fff; border: none; padding: 10px 20px;
          border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; }
  .q-btn:disabled { opacity: .5; cursor: not-allowed; }
  .q-error { color: var(--status-red); font-size: 13px; margin: 8px 0; }
  .q-gate { max-width: 480px; margin: 80px auto; text-align: center; }
  .q-done { text-align: center; padding: 40px 0; }
  @media (max-width: 700px) { .q-shell { padding: 16px; } }
</style>
</head>
<body>

<div id="q-gate" class="q-shell q-gate" style="display:none;">
  <div class="q-card">
    <p id="q-gate-message">You need to sign in first.</p>
    <a class="q-btn" href="index.html" style="display:inline-block; text-decoration:none;">Go to sign-in</a>
  </div>
</div>

<div id="q-shell" class="q-shell" style="display:none;">
  <div class="q-card">
    <div id="q-form-root"></div>
    <p id="q-error" class="q-error" style="display:none;"></p>
    <button id="q-submit-btn" class="q-btn">Submit</button>
  </div>
</div>

<div id="q-done-shell" class="q-shell" style="display:none;">
  <div class="q-card q-done">
    <p id="q-done-message">Thank you.</p>
  </div>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/questionnaires.js"></script>
</body>
</html>
