# Render blueprint for the migration beachhead.
#
# Scope: this provisions the server/ FastAPI service only. It serves no application traffic and
# implements no Apps Script action. assets/js/config.js still points at the Apps Script endpoint,
# so no production traffic moves when this deploys.
#
# plan and region are deliberately omitted. Set both in the Render dashboard so that cost and
# data residency stay explicit researcher decisions rather than defaults buried in a file.
#
# databases: is also deliberately omitted. Creating the Postgres instance in the dashboard keeps
# its plan, region and retention under the same explicit control, and lets DATABASE_URL be wired
# from the dashboard's connection string. See server/README.md.

services:
  - type: web
    name: opus-gubernatio-server
    env: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Liveness only. /readyz is not used here on purpose: a database outage would otherwise make
    # Render restart a process that is running correctly, turning a dependency failure into an
    # availability failure.
    healthCheckPath: /healthz

    envVars:
      # sync: false means Render will not read a value from this file. Set both in the dashboard.
      # DATABASE_URL carries credentials and must never appear in a tracked file.
      - key: DATABASE_URL
        sync: false
      # Comma separated list of allowed browser origins, for example
      # https://mrnyanlintun.github.io
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.7"
